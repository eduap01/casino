<header class="mb-4">
  <app-header-mini></app-header-mini>
</header>

<h3 class="text-center mb-4">¡Bienvenidos a la carta de Casino!</h3>

<!-- Submenú dinámico -->
<div class="subnav text-center mb-4">
  <button
    class="btn btn-thematic m-1"
    *ngFor="let seccion of secciones"
    (click)="scrollTo(seccion.id)">
    {{ seccion.nombre }}
  </button>
</div>

<!-- Secciones dinámicas -->
<section
  *ngFor="let seccion of secciones"
  [id]="seccion.id"
  class="mb-5">
  <h4 class="text-center mb-3">{{ seccion.nombre }}</h4>
  <div *ngFor="let plato of seccion.platos">
    <app-plato-item
      [nombre]="plato.nombre"
      [precio]="plato.precio"
      [descripcion]="plato.descripcion"
      [iconos]="plato.iconos">
    </app-plato-item>
  </div>
  <p *ngIf="seccion.platos.length === 0" class="text-center text-muted fst-italic">
    Próximamente...
  </p>
</section>

<app-back-to-top></app-back-to-top>
