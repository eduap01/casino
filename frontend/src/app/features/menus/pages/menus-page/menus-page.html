<header class="mb-4">
  <app-header-mini></app-header-mini>
</header>

<section class="menus-dia">
  <h1>Nuestros Menús</h1>
  <div class="menus-grid">
    <div class="menu-item" *ngFor="let menu of menusDia" (click)="abrirModal(menu.imagen)">
      <img [src]="menu.imagen" [alt]="menu.titulo" />
      <h3 class="menu-titulo">{{ menu.titulo }}</h3>
      <p class="menu-precio">{{ menu.precio }}</p>
    </div>
  </div>
</section>

<!-- Modal -->
<div class="modal" *ngIf="imagenSeleccionada" (click)="cerrarModal()">
  <div class="modal-contenido" (click)="$event.stopPropagation()">
    <img [src]="imagenSeleccionada" alt="Menú ampliado" />
    <button class="cerrar" (click)="cerrarModal()">✕</button>
  </div>
</div>
