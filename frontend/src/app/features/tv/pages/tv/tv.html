<div class="screen bing-tv" [class.fade]="isFading" *ngIf="current as e">
  <div class="bg" [style.backgroundImage]="'url(' + heroImage + ')'"></div>
  <div class="bg-overlay"></div>
  <div class="vignette"></div>

  <main class="stage">
    <section class="panel">

      <!-- TOPLINE -->
      <div class="topline fixed-topline">
        <span class="badge">Casino Rock Bar</span>
        <span class="dot"></span>
        <span class="meta">Próximo evento</span>
      </div>

      <div class="fade-layer" [class.fade]="isFading">

        <!-- POSTER -->
        <div class="poster-wrap">
          <img class="poster" [src]="heroImage" [alt]="e.titulo" />
          <div class="poster-glow"></div>
        </div>

        <!-- INFO -->
        <div class="info">
          <h1 class="title">{{ e.titulo }}</h1>

          <p class="desc" *ngIf="e.descripcion">
            {{ e.descripcion }}
          </p>

          <p class="desc desc--extra" *ngIf="e.texto">
            {{ e.texto }}
          </p>

          <div class="links" *ngIf="e.enlace || (e.enlaces?.length)">
            <div class="link" *ngIf="e.enlace">
              <span class="key">Info:</span>
              <span class="val">{{ e.enlace }}</span>
            </div>
          </div>
        </div>

      </div>

      <!-- ✅ FECHA ALINEADA CON NOW PLAYING -->
      <div class="tv-date fixed" *ngIf="e.fechas?.length">
        <span class="chip">
          {{ formatFechasCartelera(e.fechas) }}
        </span>
      </div>

      <!-- NOW PLAYING -->
      <div class="now-playing fixed" *ngIf="showNowPlaying">
        <div class="np-badge">SONANDO AHORA</div>

        <a class="np-card"
           [href]="nowPlaying?.trackUrl || '#'"
           target="_blank"
           rel="noopener"
           [class.is-disabled]="!(nowPlaying?.trackUrl)">

          <img
            class="np-cover"
            [src]="nowPlaying?.albumArt || fallbackArt"
            (error)="onAlbumArtError($event)"
            alt="cover"
          />

          <div class="np-meta">
            <div class="np-now">Sonando ahora</div>
            <div class="np-title">{{ nowPlaying?.title || '—' }}</div>
            <div class="np-artist">{{ nowPlaying?.artist || '' }}</div>
            <div class="np-album" *ngIf="nowPlaying?.album">
              {{ nowPlaying?.album }}
            </div>
          </div>
        </a>
      </div>

      <!-- FOOTER -->
      <div class="footer fixed">
        <div class="progress" aria-hidden="true">
          <span #progressBar class="bar"></span>
        </div>
        <div class="hint">@casinorockbar</div>
      </div>

    </section>
  </main>

  <div class="grain" aria-hidden="true"></div>
</div>
